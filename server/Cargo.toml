[package]
name = "angel-one"
version = "0.1.0"
edition = "2024"
description = "Backend do webapp do barco Angel One"
publish = false

[[bin]]
name = "angel-one"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "gzip", "query"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
web-push = { version = "0.11", default-features = false }
jwt-simple = { version = "0.12", default-features = false, features = ["pure-rust"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
water_routing = { path = "../routing" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
