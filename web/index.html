<!doctype html>
<html lang="pt-BR" data-band="tarde">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Angel One" />
    <meta name="theme-color" content="#0a5a75" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/img/asa-esq.png" />
    <link rel="preload" as="image" href="/img/asa-dir.png" />
    <title>Angel One</title>
    <script>
      // Define a faixa do dia antes do primeiro paint (evita "piscar" de tema).
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('band') || localStorage.getItem('ao.bandPreview');
          var h = Number(new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'America/Sao_Paulo' }).format(new Date()).replace(':', '.'));
          var b = h >= 5 && h < 12 ? 'manha' : h >= 12 && h < 17 ? 'tarde' : h >= 17 && h < 20 ? 'final_de_tarde' : 'noite';
          document.documentElement.dataset.band = q || b;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
